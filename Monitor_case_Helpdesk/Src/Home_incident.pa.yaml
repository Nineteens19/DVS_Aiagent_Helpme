                        - btn_ConfirmAssignModal:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledColor: =RGBA(148, 163, 184, 1)
                              DisabledFill: =RGBA(226, 232, 240, 1)
                              DisplayMode: =If(!IsBlank(Coalesce(cmb_AssignUser.Selected.DisplayName, varAssignSelectedUser.DisplayName)), DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =RGBA(1, 33, 105, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              OnSelect: |-
                                =If(
                                    IsBlank(Coalesce(cmb_AssignUser.Selected.DisplayName, varAssignSelectedUser.DisplayName)),
                                    Notify("กรุณาเลือกผู้รับมอบหมายเคสก่อนบันทึก", NotificationType.Warning),
                                    Patch(
                                        Cases,
                                        varSelectedCase,
                                        {
                                            Statuscase: { Value: If(varSelectedCase.Statuscase.Value = "Open", "In Progress", varSelectedCase.Statuscase.Value) },
                                            AssignedOwner: Coalesce(cmb_AssignUser.Selected.DisplayName, varAssignSelectedUser.DisplayName),
                                            StatusNote: "มอบหมายให้ " & Coalesce(cmb_AssignUser.Selected.DisplayName, varAssignSelectedUser.DisplayName) & " โดย " & Coalesce(varCurrentUser.FullName, User().FullName) & If(!IsBlank(txt_AssignNote.Text), " | หมายเหตุ: " & txt_AssignNote.Text, "") & " เมื่อ " & Text(Now(), "dd/mm/yyyy hh:mm")
                                        }
                                    );
                                    If(
                                        varSendAssignEmail && !IsBlank(Coalesce(cmb_AssignUser.Selected.Mail, varAssignSelectedUser.Mail, cmb_AssignUser.Selected.UserPrincipalName, varAssignSelectedUser.UserPrincipalName)),
                                        Office365Outlook.SendEmailV2(
                                            Coalesce(cmb_AssignUser.Selected.Mail, varAssignSelectedUser.Mail, cmb_AssignUser.Selected.UserPrincipalName, varAssignSelectedUser.UserPrincipalName),
                                            "[IT Helpdesk] ได้รับมอบหมายเคส " & varSelectedCase.CaseID & " - " & varSelectedCase.Title,
                                            "<div style='font-family:Segoe UI,Arial,sans-serif;max-width:650px;margin:0 auto;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden;background-color:#FFFFFF;'><div style='background-color:#012169;color:#FFFFFF;padding:20px 24px;'><h2 style='margin:0;font-size:18px;font-weight:600;'>แจ้งเตือนมอบหมายงาน IT Helpdesk</h2><p style='margin:4px 0 0 0;font-size:13px;color:#E2E8F0;'>ระบบติดตามเคสและสนับสนุนงานไอที (Monitor Case Helpdesk)</p></div><div style='padding:24px;color:#1E293B;'><p style='font-size:15px;margin-top:0;'>เรียน คุณ <b>" & Coalesce(cmb_AssignUser.Selected.DisplayName, varAssignSelectedUser.DisplayName, "เจ้าหน้าที่") & "</b>,</p><p style='font-size:14px;color:#475569;'>ท่านได้รับมอบหมายให้เป็นผู้รับผิดชอบเคสในระบบ IT Helpdesk โดยมีรายละเอียดดังนี้:</p><table style='width:100%;border-collapse:collapse;margin:16px 0;font-size:13px;'><tr style='border-bottom:1px solid #F1F5F9;'><td style='padding:8px 12px;font-weight:600;color:#64748B;width:140px;background-color:#F8FAFC;'>รหัสเคส (Case ID)</td><td style='padding:8px 12px;font-weight:bold;color:#012169;'>" & varSelectedCase.CaseID & "</td></tr><tr style='border-bottom:1px solid #F1F5F9;'><td style='padding:8px 12px;font-weight:600;color:#64748B;background-color:#F8FAFC;'>หัวข้อปัญหา (Title)</td><td style='padding:8px 12px;color:#0F172A;font-weight:600;'>" & varSelectedCase.Title & "</td></tr><tr style='border-bottom:1px solid #F1F5F9;'><td style='padding:8px 12px;font-weight:600;color:#64748B;background-color:#F8FAFC;'>ระบบงาน (System)</td><td style='padding:8px 12px;color:#0F172A;'>" & varSelectedCase.SystemName & "</td></tr><tr style='border-bottom:1px solid #F1F5F9;'><td style='padding:8px 12px;font-weight:600;color:#64748B;background-color:#F8FAFC;'>ระดับความสำคัญ</td><td style='padding:8px 12px;color:#0F172A;'>" & Coalesce(varSelectedCase.Priority.Value, "ปกติ") & " (" & Coalesce(varSelectedCase.Severity.Value, "P3") & ")</td></tr><tr style='border-bottom:1px solid #F1F5F9;'><td style='padding:8px 12px;font-weight:600;color:#64748B;background-color:#F8FAFC;'>ผู้แจ้งปัญหา</td><td style='padding:8px 12px;color:#0F172A;'>" & Coalesce(varSelectedCase.ReporterName, varSelectedCase.Author.DisplayName, "ไม่ระบุ") & " (" & Coalesce(varSelectedCase.ReporterEmail, "-") & ") โทร: " & Coalesce(varSelectedCase.ReporterTel, "-") & "</td></tr><tr style='border-bottom:1px solid #F1F5F9;'><td style='padding:8px 12px;font-weight:600;color:#64748B;background-color:#F8FAFC;'>มอบหมายโดย</td><td style='padding:8px 12px;color:#0F172A;'>" & Coalesce(varCurrentUser.FullName, User().FullName) & " เมื่อ " & Text(Now(), "dd/mm/yyyy hh:mm") & "</td></tr>" & If(!IsBlank(txt_AssignNote.Text), "<tr style='border-bottom:1px solid #F1F5F9;'><td style='padding:8px 12px;font-weight:600;color:#64748B;background-color:#F8FAFC;'>ข้อความเพิ่มเติม</td><td style='padding:8px 12px;color:#B45309;font-weight:600;'>" & txt_AssignNote.Text & "</td></tr>", "") & "</table><div style='background-color:#F8FAFC;border-left:4px solid #012169;padding:12px 16px;margin:16px 0;border-radius:0 4px 4px 0;'><div style='font-weight:600;font-size:13px;color:#012169;margin-bottom:4px;'>รายละเอียดปัญหา:</div><div style='font-size:13px;color:#334155;line-height:1.5;'>" & Coalesce(varSelectedCase.ProblemDetail, varSelectedCase.IssueSummary, "ไม่มีรายละเอียดเพิ่มเติม") & "</div></div><div style='margin:24px 0 16px 0;text-align:center;'><a href='https://apps.powerapps.com/play/e/default-tenant/a/c0bdc328-089a-41f2-bdaa-25968c78b060' style='display:inline-block;background-color:#012169;color:#FFFFFF;text-decoration:none;padding:10px 24px;border-radius:6px;font-size:14px;font-weight:600;'>เปิดดูเคสในระบบ Monitor Case Helpdesk</a></div></div><div style='background-color:#F1F5F9;padding:12px 24px;text-align:center;font-size:12px;color:#64748B;border-top:1px solid #E2E8F0;'>อีเมลฉบับนี้เป็นการแจ้งเตือนอัตโนมัติจากระบบ IT Helpdesk Monitor Case</div></div>",
                                            {
                                                Cc: Concat(cmb_AssignCC.SelectedItems, Coalesce(Mail, UserPrincipalName) & ";"),
                                                Importance: If(varSelectedCase.Severity.Value = "P1" Or varSelectedCase.Priority.Value = "ด่วน", "High", "Normal")
                                            }
                                        )
                                    );
                                    Notify(
                                        "มอบหมายเคส " & varSelectedCase.CaseID & " ให้ " & Coalesce(cmb_AssignUser.Selected.DisplayName, varAssignSelectedUser.DisplayName) & " สำเร็จเรียบร้อยแล้ว" & If(varSendAssignEmail, " (ส่งอีเมลแจ้งเตือนแล้ว)", ""),
                                        NotificationType.Success
                                    );
                                    Set(varSelectedCase, LookUp(Cases, ID = varSelectedCase.ID));
                                    Reset(cmb_AssignUser);
                                    Reset(cmb_AssignCC);
                                    Reset(txt_AssignNote);
                                    Set(varAssignSelectedUser, Blank());
                                    Set(varShowAssignModal, false);
                                    Refresh(Cases)
                                )
                              Size: =10
                              Text: ="ยืนยันการมอบหมาย"
                              Width: =150
