Screens:
  Home_incident:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(1, 33, 105, 1)
    Children:
      - ScreenContainer1_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(248, 249, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - HeaderContainer1_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(1, 33, 105, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lbl_Breadcrumb:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(255, 255, 255, 0.75)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Size: =11
                        Text: ="ระบบบริหารจัดการเทคโนโลยีสารสนเทศ > "
                  - lbl_HeaderTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        Size: =14
                        Text: ="ระบบบริหารจัดการเคสไอที (IT Helpdesk Case Monitor)"
                        Width: =460
                  - lbl_LiveStatus:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(255, 255, 255, 0.8)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Size: =11
                        Text: |-
                          ="อัปเดตล่าสุด: " & Text(varLastRefreshedTime, "hh:mm:ss")
                        Width: =160
                  - btn_Refresh:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(1, 33, 105, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(255, 205, 0, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        OnSelect: |-
                          =Refresh(Cases);
                          Refresh(Routing);
                          Refresh(SLAConfig);
                          Set(varLastRefreshedTime, Now());
                          Notify("ดึงข้อมูลเคสล่าสุดเรียบร้อยแล้ว", NotificationType.Success)
                        Size: =11
                        Text: ="รีเฟรชข้อมูล"
                        Width: =100
                  - lbl_UserInfo:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(255, 255, 255, 0.95)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Size: =11
                        Text: =varCurrentUser.FullName
                        Width: =300
            - KPICardsContainer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 249, 250, 1)
                  FillPortions: =0
                  Height: =76
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingBottom: =6
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =6
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lbl_KPI_Total:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(1, 33, 105, 1)
                        BorderThickness: =2
                        Color: =RGBA(1, 33, 105, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =60
                        OnSelect: =Set(varSelectedStatus, "All")
                        Size: =11
                        Text: |-
                          ="เคสทั้งหมด: " & Text(CountRows(Filter(Cases, Statuscase.Value <> "Closed")))
                        Width: =220
                  - lbl_KPI_Open:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(71, 85, 105, 1)
                        BorderThickness: =2
                        Color: =RGBA(71, 85, 105, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(241, 245, 249, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =60
                        OnSelect: =Set(varSelectedStatus, "Open")
                        Size: =11
                        Text: |-
                          ="รอรับเรื่อง: " & Text(CountRows(Filter(Cases, Statuscase.Value = "Open")))
                        Width: =220
                  - lbl_KPI_Progress:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(180, 83, 9, 1)
                        BorderThickness: =2
                        Color: =RGBA(180, 83, 9, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(254, 243, 199, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =60
                        OnSelect: =Set(varSelectedStatus, "In Progress")
                        Size: =11
                        Text: |-
                          ="กำลังแก้ไข: " & Text(CountRows(Filter(Cases, Statuscase.Value = "In Progress")))
                        Width: =220
                  - lbl_KPI_Resolved:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(4, 120, 87, 1)
                        BorderThickness: =2
                        Color: =RGBA(4, 120, 87, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(209, 250, 229, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =60
                        OnSelect: =Set(varSelectedStatus, "Resolved")
                        Size: =11
                        Text: |-
                          ="ปิดงานแล้ว: " & Text(CountRows(Filter(Cases, Statuscase.Value = "Resolved")))
                        Width: =220
                  - lbl_KPI_Sla:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(190, 18, 60, 1)
                        BorderThickness: =2
                        Color: =RGBA(190, 18, 60, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(255, 228, 230, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =60
                        OnSelect: =Set(varSelectedStatus, "Open")
                        Size: =11
                        Text: |-
                          ="เกินกำหนดเวลา SLA: " & Text(CountRows(Filter(Cases, Statuscase.Value = "Open" && Created < DateAdd(Now(), -48, TimeUnit.Hours))))
                        Width: =220
            - ControlBarContainer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingBottom: =6
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =6
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - btn_FilterAll:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        Color: =If(varSelectedStatus = "All", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =If(varSelectedStatus = "All", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        OnSelect: =Set(varSelectedStatus, "All")
                        Size: =11
                        Text: ="ทั้งหมด"
                        Width: =70
                  - btn_FilterOpen:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        Color: =If(varSelectedStatus = "Open", RGBA(255, 255, 255, 1), RGBA(71, 85, 105, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =If(varSelectedStatus = "Open", RGBA(71, 85, 105, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        OnSelect: =Set(varSelectedStatus, "Open")
                        Size: =11
                        Text: ="รอรับเรื่อง"
                        Width: =85
                  - btn_FilterInProgress:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        Color: =If(varSelectedStatus = "In Progress", RGBA(255, 255, 255, 1), RGBA(180, 83, 9, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =If(varSelectedStatus = "In Progress", RGBA(180, 83, 9, 1), RGBA(254, 243, 199, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        OnSelect: =Set(varSelectedStatus, "In Progress")
                        Size: =11
                        Text: ="กำลังแก้ไข"
                        Width: =95
                  - btn_FilterResolved:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        Color: =If(varSelectedStatus = "Resolved", RGBA(255, 255, 255, 1), RGBA(4, 120, 87, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =If(varSelectedStatus = "Resolved", RGBA(4, 120, 87, 1), RGBA(209, 250, 229, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        OnSelect: =Set(varSelectedStatus, "Resolved")
                        Size: =11
                        Text: ="ปิดงานแล้ว"
                        Width: =85
                  - cmb_SystemFilter:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        ChevronBackground: =RGBA(35, 31, 32, 1)
                        ChevronDisabledBackground: =RGBA(215, 210, 204, 1)
                        ChevronDisabledFill: =RGBA(235, 233, 229, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(Self.ChevronBackground, 20%)
                        ChevronHoverFill: =Self.ChevronFill
                        Color: =RGBA(15, 23, 42, 1)
                        DefaultSelectedItems: =[]
                        DisabledBorderColor: =RGBA(186, 186, 186, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        DisabledFill: =RGBA(242, 242, 242, 1)
                        DisplayFields: =["Value"]
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverColor: =Self.Color
                        HoverFill: =RGBA(241, 245, 249, 1)
                        InputTextPlaceholder: ="เลือกระบบงาน..."
                        IsSearchable: =false
                        Items: |-
                          =Sort(
                              Distinct(Cases, SystemName),
                              Value,
                              SortOrder.Ascending
                          )
                        OnChange: =Set(varSelectedSystem, Self.Selected.Value)
                        PressedColor: =Self.Color
                        PressedFill: =ColorFade(Self.SelectionFill, -30%)
                        SearchFields: =["Value"]
                        SelectMultiple: =false
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(1, 33, 105, 1)
                        Size: =11
                        Tooltip: ="กรองตามระบบงาน"
                        Width: =180
                  - txt_SearchBox:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        Color: =RGBA(15, 23, 42, 1)
                        DisabledBorderColor: =ColorFade(Self.BorderColor, 40%)
                        DisabledColor: =ColorFade(Self.Color, 40%)
                        DisabledFill: =Self.Fill
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HintText: ="ค้นหาชื่อผู้ทำรายการ (ผู้แจ้ง), รหัสเคส..."
                        HoverBorderColor: =Self.Color
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        OnChange: =Set(varSearchQuery, Self.Text)
                        Size: =11
                        Tooltip: ="ค้นหาจากชื่อผู้ทำรายการ/ผู้แจ้ง หรือรหัสเคส"
                        Width: =340
                  - btn_ResetFilter:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(100, 116, 139, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        OnSelect: |-
                          =Set(varSelectedStatus, "All");
                          Set(varSearchQuery, "");
                          Set(varSelectedSystem, "");
                          Reset(txt_SearchBox);
                          Reset(cmb_SystemFilter)
                        Size: =11
                        Text: ="ล้างตัวกรอง"
                        Width: =95
            - WorkspaceContainer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 249, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height - 210
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - LeftPaneContainer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Height: =Parent.Height - 16
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =0
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =If(varShowDrawer, Parent.Width - 520, Parent.Width - 32)
                      Children:
                        - GridHeaderContainer:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(1, 33, 105, 1)
                              FillPortions: =0
                              Height: =38
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =20
                              LayoutMinWidth: =32
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              Width: =Parent.Width
                            Children:
                              - lbl_HdrCaseID:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="รหัสเคส"
                                    Width: =110
                              - lbl_HdrSystem:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="ระบบงาน"
                                    Width: =130
                              - lbl_HdrTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="หัวข้อปัญหา"
                                    Width: =280
                              - lbl_HdrReporter:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="ผู้แจ้ง"
                                    Width: =130
                              - lbl_HdrCreated:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="วันที่แจ้ง"
                                    Width: =120
                              - lbl_HdrStatus:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="สถานะ"
                                    Width: =110
                              - lbl_HdrAction:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="การจัดการ"
                                    Width: =90
                        - Gallery1:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(226, 232, 240, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Items: |-
                                =SortByColumns(
                                    Filter(
                                        Cases,
                                        (varSelectedStatus = "All" Or Statuscase.Value = varSelectedStatus) And
                                        (IsBlank(cmb_SystemFilter.Selected.Value) Or SystemName = cmb_SystemFilter.Selected.Value) And
                                        (
                                            IsBlank(txt_SearchBox.Text) Or
                                            StartsWith(ReporterName, txt_SearchBox.Text) Or
                                            StartsWith(CaseID, txt_SearchBox.Text) Or
                                            StartsWith(Title, txt_SearchBox.Text)
                                        )
                                    ),
                                    "Created",
                                    SortOrder.Descending
                                )
                              LayoutMinHeight: =32
                              LayoutMinWidth: =32
                              TemplateSize: =44
                              Width: =Parent.Width
                            Children:
                              - Title1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(1, 33, 105, 1)
                                    DisabledColor: =RGBA(186, 186, 186, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    OnSelect: =Set(varSelectedCase, ThisItem); Set(varShowDrawer, true)
                                    PaddingLeft: =8
                                    Size: =11
                                    Text: =ThisItem.CaseID
                                    Width: =110
                                    X: =10
                                    Y: =6
                              - lbl_RowSystemVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(71, 85, 105, 1)
                                    DisabledColor: =RGBA(186, 186, 186, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    OnSelect: =Set(varSelectedCase, ThisItem); Set(varShowDrawer, true)
                                    PaddingLeft: =4
                                    Size: =10
                                    Text: =ThisItem.SystemName
                                    Width: =120
                                    X: =125
                                    Y: =6
                              - Subtitle1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(15, 23, 42, 1)
                                    DisabledColor: =RGBA(186, 186, 186, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    OnSelect: =Set(varSelectedCase, ThisItem); Set(varShowDrawer, true)
                                    PaddingLeft: =4
                                    Size: =10
                                    Text: =ThisItem.Title
                                    Width: =280
                                    X: =255
                                    Y: =6
                              - lbl_RowReporterVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(100, 116, 139, 1)
                                    DisabledColor: =RGBA(186, 186, 186, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    OnSelect: =Set(varSelectedCase, ThisItem); Set(varShowDrawer, true)
                                    PaddingLeft: =4
                                    Size: =10
                                    Text: =Coalesce(ThisItem.ReporterName, ThisItem.Author.DisplayName)
                                    Width: =120
                                    X: =545
                                    Y: =6
                              - lbl_RowCreatedVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(100, 116, 139, 1)
                                    DisabledColor: =RGBA(186, 186, 186, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    OnSelect: =Set(varSelectedCase, ThisItem); Set(varShowDrawer, true)
                                    PaddingLeft: =4
                                    Size: =10
                                    Text: |-
                                      =Text(ThisItem.Created, "dd/mm/yy hh:mm")
                                    Width: =110
                                    X: =675
                                    Y: =6
                              - StatusBadge:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =If(ThisItem.Statuscase.Value = "Open", RGBA(71, 85, 105, 1), If(ThisItem.Statuscase.Value = "In Progress", RGBA(180, 83, 9, 1), If(ThisItem.Statuscase.Value = "Resolved", RGBA(4, 120, 87, 1), RGBA(15, 23, 42, 1))))
                                    DisabledColor: =RGBA(186, 186, 186, 1)
                                    Fill: =If(ThisItem.Statuscase.Value = "Open", RGBA(241, 245, 249, 1), If(ThisItem.Statuscase.Value = "In Progress", RGBA(254, 243, 199, 1), If(ThisItem.Statuscase.Value = "Resolved", RGBA(209, 250, 229, 1), RGBA(226, 232, 240, 1))))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    OnSelect: =Set(varSelectedCase, ThisItem); Set(varShowDrawer, true)
                                    Size: =10
                                    Text: =ThisItem.Statuscase.Value
                                    Width: =95
                                    X: =795
                                    Y: =9
                              - NextArrow1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(1, 33, 105, 1)
                                    BorderThickness: =1
                                    Color: =RGBA(1, 33, 105, 1)
                                    DisabledColor: =RGBA(186, 186, 186, 1)
