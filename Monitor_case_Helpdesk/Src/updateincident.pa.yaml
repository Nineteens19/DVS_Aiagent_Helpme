                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(255, 255, 255, 0.15)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Navigate(Home_incident, ScreenTransition.Fade)
                        Size: =11
                        Text: ="ย้อนกลับคิวงาน"
                        Width: =140
                  - lbl_UpdateTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Size: =14
                        Text: |-
                          ="จัดการสถานะและรายละเอียดเคส"
                        Width: =400
                  - btn_AssignMe:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(1, 33, 105, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(255, 205, 0, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        OnSelect: |-
                          =Patch(
                              Cases,
                              Coalesce(varSelectedCase, Gallery1.Selected),
                              {
                                  Statuscase: { Value: "In Progress" },
                                  AssignedOwner: Coalesce(varCurrentUser.FullName, User().FullName)
                              }
                          );
                          Notify("คุณได้รับมอบหมายเคสนี้เรียบร้อยแล้ว สถานะเปลี่ยนเป็น In Progress", NotificationType.Success);
                          Set(varSelectedCase, LookUp(Cases, ID = Coalesce(varSelectedCase.ID, Gallery1.Selected.ID)));
                          Refresh(Cases)
                        Size: =11
                        Text: |-
                          ="รับเคส (Assign Me)"
                        Width: =160
                  - btn_AssignOther:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(2, 132, 199, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        OnSelect: |-
                          =Set(varSelectedCase, Coalesce(varSelectedCase, Gallery1.Selected));
                          Navigate(Home_incident, ScreenTransition.Fade);
                          Set(varShowAssignModal, true);
                          Set(varAssignSelectedUser, Blank());
                          Reset(cmb_AssignUser);
                          Reset(cmb_AssignCC);
                          Reset(txt_AssignNote);
                          Set(varSendAssignEmail, true)
