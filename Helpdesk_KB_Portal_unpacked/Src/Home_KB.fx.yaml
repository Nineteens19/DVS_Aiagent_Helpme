Home_KB As screen:
    Fill: =RGBA(248, 249, 250, 1)
    LoadingSpinnerColor: =RGBA(1, 33, 105, 1)

    conAppFrame As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(248, 249, 250, 1)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        Width: =Parent.Width

        conHeader As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(1, 33, 105, 1)
            FillPortions: =0
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8

            lbl_BrandName As label:
                Color: =RGBA(255, 205, 0, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Bold
                Height: =36
                Size: =12
                Text: ="DEVES INSURANCE"

            lbl_HeaderTitle As label:
                Color: =RGBA(255, 255, 255, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Bold
                Height: =36
                Size: =13
                Text: ="Helpdesk AI Knowledge Base Management Portal"
                Width: =420

            lbl_RoleBadge As label:
                Align: =Align.Center
                BorderColor: =RGBA(0, 0, 0, 0)
                Color: =If(varIsKBAdmin, RGBA(4, 120, 87, 1), RGBA(71, 85, 105, 1))
                Fill: =If(varIsKBAdmin, RGBA(209, 250, 229, 1), RGBA(241, 245, 249, 1))
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =28
                Size: =10
                Text: =varUserRole
                Width: =160

            lbl_HeaderSync As label:
                Color: =RGBA(255, 255, 255, 0.8)
                Font: =Font.'Segoe UI'
                Height: =36
                Size: =10
                Text: |-
                    ="อัปเดตล่าสุด: " & Text(varLastRefreshedTime, "hh:mm:ss")
                Width: =140

            btn_GlobalRefresh As label:
                Align: =Align.Center
                BorderColor: =RGBA(0, 0, 0, 0)
                Color: =RGBA(1, 33, 105, 1)
                Fill: =RGBA(255, 205, 0, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =30
                OnSelect: |-
                    =Refresh(AI_KnowledgeBase);
                    Refresh(SystemManuals);
                    Refresh(Systems);
                    Refresh(KnowledgeGaps);
                    Set(varLastRefreshedTime, Now());
                    Notify("รีเฟรชข้อมูล SharePoint ทั้งหมดเรียบร้อยแล้ว", NotificationType.Success)
                Size: =10
                Text: ="รีเฟรชข้อมูล"
                Width: =90

            lbl_UserProfile As label:
                Align: =Align.Right
                Color: =RGBA(255, 255, 255, 0.95)
                Font: =Font.'Segoe UI'
                Height: =36
                Size: =11
                Text: =varCurrentUser.FullName
                Width: =280

        conKPIBar As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(248, 249, 250, 1)
            FillPortions: =0
            Height: =74
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =6
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =6
            Width: =Parent.Width

            lbl_KPI_Manuals As label:
                Align: =Align.Center
                BorderColor: =RGBA(1, 33, 105, 1)
                BorderThickness: =2
                Color: =RGBA(1, 33, 105, 1)
                Fill: =RGBA(255, 255, 255, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =58
                OnSelect: =Set(varActiveTab, "MANUALS")
                Size: =11
                Text: |-
                    ="คู่มือระบบที่อนุมัติ: " & Text(CountRows(Filter(SystemManuals, Not('{IsFolder}') && Coalesce(IsActive, true) = true))) & " รายการ"
                Width: =310

            lbl_KPI_QnA As label:
                Align: =Align.Center
                BorderColor: =RGBA(4, 120, 87, 1)
                BorderThickness: =2
                Color: =RGBA(4, 120, 87, 1)
                Fill: =RGBA(209, 250, 229, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =58
                OnSelect: =Set(varActiveTab, "QNA"); Set(varFilterStatus, "Active")
                Size: =11
                Text: |-
                    ="Q&A เปิดใช้งาน: " & Text(CountRows(Filter(AI_KnowledgeBase, Coalesce(Is_Active.Value, Is_Active, "Active") = "Active" || Coalesce(Is_Active.Value, Is_Active, "") = "Yes"))) & " รายการ"
                Width: =310

            lbl_KPI_Gaps As label:
                Align: =Align.Center
                BorderColor: =RGBA(180, 83, 9, 1)
                BorderThickness: =2
                Color: =RGBA(180, 83, 9, 1)
                Fill: =RGBA(254, 243, 199, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =58
                OnSelect: =Set(varActiveTab, "GAPS")
                Size: =11
                Text: |-
                    ="คำถามรอตอบ (Gaps): " & Text(CountRows(Filter(KnowledgeGaps, Coalesce(GapStatus.Value, GapStatus, "New") = "New"))) & " ข้อ"
                Width: =310

            lbl_KPI_Systems As label:
                Align: =Align.Center
                BorderColor: =RGBA(10, 53, 144, 1)
                BorderThickness: =2
                Color: =RGBA(10, 53, 144, 1)
                Fill: =RGBA(239, 246, 255, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =58
                Size: =11
                Text: |-
                    ="ระบบงานในสารบบ: " & Text(CountRows(colMasterSystems)) & " ระบบ"
                Width: =310

        conModuleTabs As groupContainer.horizontalAutoLayoutContainer:
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            Height: =46
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =8
            PaddingBottom: =4
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =4
            Width: =Parent.Width

            btn_TabQnA As label:
                Align: =Align.Center
                BorderColor: =If(varActiveTab = "QNA", RGBA(1, 33, 105, 1), RGBA(226, 232, 240, 1))
                BorderThickness: =1
                Color: =If(varActiveTab = "QNA", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                Fill: =If(varActiveTab = "QNA", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =36
                OnSelect: =Set(varActiveTab, "QNA"); Set(varDrawerOpen, false)
                Size: =11
                Text: ="1. คำถาม-คำตอบ (Q&A Knowledge Base)"
                Width: =270

            btn_TabManuals As label:
                Align: =Align.Center
                BorderColor: =If(varActiveTab = "MANUALS", RGBA(1, 33, 105, 1), RGBA(226, 232, 240, 1))
                BorderThickness: =1
                Color: =If(varActiveTab = "MANUALS", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                Fill: =If(varActiveTab = "MANUALS", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =36
                OnSelect: =Set(varActiveTab, "MANUALS"); Set(varDrawerOpen, false)
                Size: =11
                Text: ="2. คู่มือระบบ (System Manuals Library)"
                Width: =270

            btn_TabGaps As label:
                Align: =Align.Center
                BorderColor: =If(varActiveTab = "GAPS", RGBA(1, 33, 105, 1), RGBA(226, 232, 240, 1))
                BorderThickness: =1
                Color: =If(varActiveTab = "GAPS", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                Fill: =If(varActiveTab = "GAPS", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =36
                OnSelect: =Set(varActiveTab, "GAPS"); Set(varDrawerOpen, false)
                Size: =11
                Text: ="3. คำถามที่รอตอบ (Knowledge Gaps)"
                Width: =270

            btn_UploadManualTrigger As label:
                Align: =Align.Center
                BorderColor: =RGBA(0, 0, 0, 0)
                Color: =RGBA(255, 255, 255, 1)
                Fill: =RGBA(40, 167, 69, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =36
                OnSelect: =Set(varUploadModalOpen, true)
                Size: =11
                Text: ="+ อัปโหลดคู่มือระบบใหม่"
                Visible: =varIsKBAdmin && varActiveTab = "MANUALS"
                Width: =180

        conMainWorkspace As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(248, 249, 250, 1)
            Height: =Parent.Height - 210
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =12
            PaddingBottom: =8
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =4
            Width: =Parent.Width

            conQnAView As groupContainer.verticalAutoLayoutContainer:
                Fill: =RGBA(248, 249, 250, 1)
                Height: =Parent.Height
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGap: =8
                Visible: =varActiveTab = "QNA"
                Width: =If(varDrawerOpen, Parent.Width - 440, Parent.Width)

                conQnAToolbar As groupContainer.horizontalAutoLayoutContainer:
                    BorderColor: =RGBA(226, 232, 240, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    FillPortions: =0
                    Height: =44
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGap: =8
                    PaddingBottom: =4
                    PaddingLeft: =12
                    PaddingRight: =12
                    PaddingTop: =4
                    RadiusBottomLeft: =6
                    RadiusBottomRight: =6
                    RadiusTopLeft: =6
                    RadiusTopRight: =6
                    Width: =Parent.Width

                    txt_QnASearch As text:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        Color: =RGBA(15, 23, 42, 1)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        HintText: ="ค้นหาคำถาม, หัวข้อปัญหา, หรือ KB ID..."
                        Size: =10

                    dd_QnASystemFilter As combobox:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        Height: =32
                        Items: =colMasterSystems.Title
                        SelectMultiple: =false
                        Width: =200

                    btn_QnASearchClear As label:
                        Align: =Align.Center
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        Color: =RGBA(71, 85, 105, 1)
                        Fill: =RGBA(241, 245, 249, 1)
                        Font: =Font.'Segoe UI'
                        Height: =30
                        OnSelect: =Reset(txt_QnASearch); Reset(dd_QnASystemFilter); Set(varFilterStatus, "All")
                        Size: =10
                        Text: ="ล้างตัวกรอง"
                        Width: =80

                    btn_QnAFilterAll As label:
                        Align: =Align.Center
                        BorderColor: =If(varFilterStatus = "All", RGBA(1, 33, 105, 1), RGBA(226, 232, 240, 1))
                        BorderThickness: =1
                        Color: =If(varFilterStatus = "All", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                        Fill: =If(varFilterStatus = "All", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        OnSelect: =Set(varFilterStatus, "All")
                        Size: =10
                        Text: ="ทั้งหมด"
                        Width: =70

                    btn_QnAFilterActive As label:
                        Align: =Align.Center
                        BorderColor: =If(varFilterStatus = "Active", RGBA(4, 120, 87, 1), RGBA(226, 232, 240, 1))
                        BorderThickness: =1
                        Color: =If(varFilterStatus = "Active", RGBA(255, 255, 255, 1), RGBA(4, 120, 87, 1))
                        Fill: =If(varFilterStatus = "Active", RGBA(4, 120, 87, 1), RGBA(209, 250, 229, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        OnSelect: =Set(varFilterStatus, "Active")
                        Size: =10
                        Text: ="Active (เปิด)"
                        Width: =85

                    btn_QnAFilterInactive As label:
                        Align: =Align.Center
                        BorderColor: =If(varFilterStatus = "Inactive", RGBA(71, 85, 105, 1), RGBA(226, 232, 240, 1))
                        BorderThickness: =1
                        Color: =If(varFilterStatus = "Inactive", RGBA(255, 255, 255, 1), RGBA(71, 85, 105, 1))
                        Fill: =If(varFilterStatus = "Inactive", RGBA(71, 85, 105, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        OnSelect: =Set(varFilterStatus, "Inactive")
                        Size: =10
                        Text: ="Inactive (ปิด)"
                        Width: =85

                    btn_NewQnAAction As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(1, 33, 105, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        OnSelect: =Set(varDrawerMode, "NEW"); Set(varSelectedQnA, Blank()); Set(varDrawerOpen, true)
                        Size: =10
                        Text: ="+ เพิ่มข้อคำถาม Q&A"
                        Visible: =varIsKBAdmin

                conQnAGridHeader As groupContainer.horizontalAutoLayoutContainer:
                    Fill: =RGBA(1, 33, 105, 1)
                    FillPortions: =0
                    Height: =38
                    LayoutAlignItems: =LayoutAlignItems.Center
                    PaddingLeft: =12
                    PaddingRight: =12
                    RadiusTopLeft: =6
                    RadiusTopRight: =6
                    Width: =Parent.Width

                    lbl_HdrQID As label:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =10
                        Text: ="KB ID"
                        Width: =100

                    lbl_HdrQSys As label:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =10
                        Text: ="ระบบงาน"
                        Width: =130

                    lbl_HdrQTitle As label:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =10
                        Text: ="หัวข้อคำถาม (Question)"
                        Width: =290

                    lbl_HdrQAns As label:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =10
                        Text: ="คำตอบที่อนุมัติ (Approved Answer)"
                        Width: =320

                    lbl_HdrQCat As label:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =10
                        Text: ="หมวดหมู่"
                        Width: =110

                    lbl_HdrQStat As label:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =10
                        Text: ="สถานะ"
                        Width: =80

                    lbl_HdrQToggle As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =10
                        Text: ="สลับสถานะ"
                        Width: =70

                    lbl_HdrQAct As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =10
                        Text: ="การจัดการ"
                        Width: =90

                "galQnAGrid As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    BorderColor: =RGBA(226, 232, 240, 1)
                    Fill: =RGBA(255, 255, 255, 1)
                    Items: |-
                        =SortByColumns(
                            Filter(
                                AI_KnowledgeBase,
                                (IsBlank(txt_QnASearch.Text) Or StartsWith(Issue_Title, txt_QnASearch.Text) Or StartsWith(Title, txt_QnASearch.Text)) And
                                (IsBlank(dd_QnASystemFilter.Selected.Value) Or System = dd_QnASystemFilter.Selected.Value) And
                                (varFilterStatus = "All" Or (varFilterStatus = "Active" And (Coalesce(Is_Active.Value, Is_Active, "Active") = "Active" Or Coalesce(Is_Active.Value, Is_Active, "") = "Yes")) Or (varFilterStatus = "Inactive" And (Coalesce(Is_Active.Value, Is_Active, "") = "Inactive" Or Coalesce(Is_Active.Value, Is_Active, "") = "No")))
                            ),
                            "Created",
                            SortOrder.Descending
                        )
                    TemplateSize: =44
                    Width: =Parent.Width

                    lbl_RowQID As label:
                        Color: =RGBA(100, 116, 139, 1)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        PaddingLeft: =8
                        Size: =10
                        Text: =ThisItem.Title
                        Width: =95
                        X: =10
                        Y: =6

                    lbl_RowQSys As label:
                        Color: =RGBA(71, 85, 105, 1)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        PaddingLeft: =4
                        Size: =10
                        Text: =ThisItem.System
                        Width: =120
                        X: =110
                        Y: =6

                    lbl_RowQTitle As label:
                        Color: =RGBA(1, 33, 105, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        OnSelect: =Set(varSelectedQnA, ThisItem); Set(varDrawerMode, "EDIT"); Set(varDrawerOpen, true)
                        PaddingLeft: =4
                        Size: =10
                        Text: =ThisItem.Issue_Title
                        Tooltip: ="คลิกเพื่อแก้ไขคำถาม"
                        Width: =280
                        X: =240
                        Y: =6

                    lbl_RowQAns As label:
                        Color: =RGBA(15, 23, 42, 1)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        PaddingLeft: =4
                        Size: =10
                        Text: |-
                            ="คำตอบ: " & Left(ThisItem.Approved_Answer, 65) & If(Len(ThisItem.Approved_Answer) > 65, "...", "")
                        Width: =310
                        X: =530
                        Y: =6

                    lbl_RowQCat As label:
                        Color: =RGBA(100, 116, 139, 1)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        PaddingLeft: =4
                        Size: =10
                        Text: =If(IsBlank(ThisItem.Category.Value), "General", ThisItem.Category.Value)
                        Width: =100
                        X: =850
                        Y: =6

                    lbl_RowQStat As label:
                        Align: =Align.Center
                        Color: =If(Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "Active") = "Active" || Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "") = "Yes", RGBA(4, 120, 87, 1), RGBA(71, 85, 105, 1))
                        Fill: =If(Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "Active") = "Active" || Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "") = "Yes", RGBA(209, 250, 229, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =9
                        Text: =If(Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "Active") = "Active" || Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "") = "Yes", "Active", "Inactive")
                        Width: =70
                        X: =960
                        Y: =10

                    btn_RowQToggle As label:
                        Align: =Align.Center
                        Color: =If(Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "Active") = "Active" || Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "") = "Yes", RGBA(180, 83, 9, 1), RGBA(4, 120, 87, 1))
                        Fill: =If(Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "Active") = "Active" || Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "") = "Yes", RGBA(254, 243, 199, 1), RGBA(209, 250, 229, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        OnSelect: |-
                            =Patch(
                                AI_KnowledgeBase,
                                ThisItem,
                                {
                                    Is_Active: If(Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "Active") = "Active" || Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "") = "Yes", { Value: "Inactive" }, { Value: "Active" })
                                }
                            );
                            Notify("สลับสถานะ Q&A เรียบร้อยแล้ว", NotificationType.Success)
                        Size: =9
                        Text: =If(Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "Active") = "Active" || Coalesce(ThisItem.Is_Active.Value, ThisItem.Is_Active, "") = "Yes", "ปิด", "เปิด")
                        Visible: =varIsKBAdmin
                        Width: =55
                        X: =1040
                        Y: =9

                    btn_RowQEdit As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(1, 33, 105, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        OnSelect: =Set(varSelectedQnA, ThisItem); Set(varDrawerMode, "EDIT"); Set(varDrawerOpen, true)
                        Size: =9
                        Text: ="แก้ไข"
                        Visible: =varIsKBAdmin
                        Width: =40
                        X: =1105
                        Y: =9

                    btn_RowQDel As label:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(220, 53, 69, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        OnSelect: |-
                            =Set(varSelectedQnA, ThisItem);
                            Set(varConfirmAction, "DELETE_QNA");
                            Set(varConfirmMessage, "คุณแน่ใจหรือไม่ว่าต้องการลบคำถาม: '" & ThisItem.Issue_Title & "' ?");
                            Set(varShowConfirmModal, true)
                        Size: =9
                        Text: ="ลบ"
                        Visible: =varIsKBAdmin
                        Width: =35
                        X: =1150
                        Y: =9

            conManualsView As groupContainer.horizontalAutoLayoutContainer:
                Fill: =RGBA(248, 249, 250, 1)
                Height: =Parent.Height
                LayoutAlignItems: =LayoutAlignItems.Stretch
                LayoutGap: =12
                Visible: =varActiveTab = "MANUALS"
                Width: =Parent.Width

                conFoldersPane As groupContainer.verticalAutoLayoutContainer:
                    BorderColor: =RGBA(226, 232, 240, 1)
                    BorderThickness: =1
                    Fill: =RGBA(255, 255, 255, 1)
                    FillPortions: =0
                    Height: =Parent.Height - 16
                    LayoutAlignItems: =LayoutAlignItems.Stretch
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =6
                    PaddingBottom: =10
                    PaddingLeft: =10
                    PaddingRight: =10
                    PaddingTop: =10
                    RadiusBottomLeft: =6
                    RadiusBottomRight: =6
                    RadiusTopLeft: =6
                    RadiusTopRight: =6
                    Width: =280

                    lbl_FoldersHdr As label:
                        Color: =RGBA(1, 33, 105, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =11
                        Text: ="โฟลเดอร์ระบบงาน (Systems)"
                        Width: =260

                    txt_FolderSearch As text:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        Color: =RGBA(15, 23, 42, 1)
                        Font: =Font.'Segoe UI'
