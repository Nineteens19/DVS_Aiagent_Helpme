                Text: =If(varDrawerMode = "NEW", "เพิ่มคำถาม-คำตอบใหม่ (New Q&A)", If(varDrawerMode = "NEW_FROM_GAP", "แปลงคำถามเป็น Q&A (Convert Gap to KB)", "แก้ไขข้อมูล Q&A (Edit Q&A)"))
                Width: =330

            btn_DrawerClose As label:
                Align: =Align.Center
                Color: =RGBA(255, 255, 255, 0.9)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Bold
                Height: =32
                OnSelect: =Set(varDrawerOpen, false)
                Size: =12
                Text: ="X"
                Width: =36

        lbl_PromptQuestion As label:
            Color: =RGBA(15, 23, 42, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =10
            Text: ="คำถาม / หัวข้อปัญหา (Question / Issue Title) *"
            Width: =390

        txt_DrawerQuestion As text:
            BorderColor: =RGBA(226, 232, 240, 1)
            Default: =If(varDrawerMode = "NEW_FROM_GAP", Coalesce(varSelectedGap.UserQuestion, varSelectedGap.Title, ""), If(varDrawerMode = "EDIT", varSelectedQnA.Issue_Title, ""))
            Font: =Font.'Segoe UI'
            Height: =34
            HintText: ="พิมพ์คำถามหลัก..."
            Size: =10
            Width: =390

        lbl_PromptSystem As label:
            Color: =RGBA(15, 23, 42, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =10
            Text: ="ระบบงานที่เกี่ยวข้อง (System Name) *"
            Width: =390

        dd_DrawerSystem As combobox:
            BorderColor: =RGBA(226, 232, 240, 1)
            DefaultSelectedItems: =If(varDrawerMode = "NEW_FROM_GAP" && !IsBlank(varSelectedGap.SystemGuess), [varSelectedGap.SystemGuess], If(varDrawerMode = "EDIT" && !IsBlank(varSelectedQnA.System), [varSelectedQnA.System], []))
            Height: =34
            Items: =colMasterSystems.Title
            SelectMultiple: =false
            Width: =390

        lbl_PromptAnswer As label:
            Color: =RGBA(15, 23, 42, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =10
            Text: ="คำตอบและขั้นตอนที่อนุมัติแล้ว (Approved Answer) *"
            Width: =390

        txt_DrawerAnswer As text:
            BorderColor: =RGBA(226, 232, 240, 1)
            Default: =If(varDrawerMode = "EDIT", varSelectedQnA.Approved_Answer, "")
            Font: =Font.'Segoe UI'
            Height: =120
            HintText: ="ระบุขั้นตอนและคำตอบที่ถูกต้อง..."
            Mode: =TextMode.MultiLine
            Size: =10
            Width: =390

        lbl_PromptReqInfo As label:
            Color: =RGBA(15, 23, 42, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =10
            Text: ="ข้อมูลที่จำเป็นต้องขอจากผู้ใช้ (Required Information)"
            Width: =390

        txt_DrawerReqInfo As text:
            BorderColor: =RGBA(226, 232, 240, 1)
            Default: |-
                =If(varDrawerMode = "NEW_FROM_GAP" && !IsBlank(varSelectedGap.RelatedCaseID), "อ้างอิง Case: " & varSelectedGap.RelatedCaseID, If(varDrawerMode = "EDIT", varSelectedQnA.Required_Information, ""))
            Font: =Font.'Segoe UI'
            Height: =60
            HintText: ="เช่น เลขกรมธรรม์, รหัสพนักงาน (ถ้ามี)..."
            Mode: =TextMode.MultiLine
            Size: =10
            Width: =390

        conDrawerButtons As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingTop: =8
            Width: =390

            btn_DrawerCancel As label:
                Align: =Align.Center
                BorderColor: =RGBA(203, 213, 225, 1)
                BorderThickness: =1
                Color: =RGBA(71, 85, 105, 1)
                Fill: =RGBA(248, 249, 250, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =34
                OnSelect: =Set(varDrawerOpen, false)
                Size: =10
                Text: ="ยกเลิก"
                Width: =90

            btn_DrawerSave As label:
                Align: =Align.Center
                Color: =RGBA(255, 255, 255, 1)
                Fill: =RGBA(1, 33, 105, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =34
                OnSelect: |-
                    =If(
                        IsBlank(txt_DrawerQuestion.Text) Or IsBlank(txt_DrawerAnswer.Text),
                        Notify("กรุณากรอกคำถามและคำตอบที่อนุมัติให้ครบถ้วน", NotificationType.Error),
                        If(
                            varDrawerMode = "NEW_FROM_GAP",
                            Patch(
                                AI_KnowledgeBase,
                                Defaults(AI_KnowledgeBase),
                                {
                                    Title: "KB-" & Text(Now(), "yyyymmddhhmmss"),
                                    Issue_Title: txt_DrawerQuestion.Text,
                                    System: If(IsBlank(dd_DrawerSystem.Selected.Value), "General", dd_DrawerSystem.Selected.Value),
                                    Approved_Answer: txt_DrawerAnswer.Text,
                                    Required_Information: txt_DrawerReqInfo.Text,
                                    Review_Status: { Value: "Approved" },
                                    Is_Active: { Value: "Active" }
                                }
                            );
                            Patch(
                                KnowledgeGaps,
                                varSelectedGap,
                                {
                                    GapStatus: {Value: "Added to KB"}
                                }
                            );
                            Set(varDrawerOpen, false);
                            Notify("แปลงคำถามเข้าสู่ Q&A Knowledge Base สำเร็จแล้ว", NotificationType.Success),
                            If(
                                varDrawerMode = "NEW",
                                Patch(
                                    AI_KnowledgeBase,
                                    Defaults(AI_KnowledgeBase),
                                    {
                                        Title: "KB-" & Text(Now(), "yyyymmddhhmmss"),
                                        Issue_Title: txt_DrawerQuestion.Text,
                                        System: If(IsBlank(dd_DrawerSystem.Selected.Value), "General", dd_DrawerSystem.Selected.Value),
                                        Approved_Answer: txt_DrawerAnswer.Text,
                                        Required_Information: txt_DrawerReqInfo.Text,
                                        Review_Status: { Value: "Approved" },
                                        Is_Active: { Value: "Active" }
                                    }
                                );
                                Set(varDrawerOpen, false);
                                Notify("บันทึกข้อมูล Q&A เรียบร้อยแล้ว", NotificationType.Success),
                                Patch(
                                    AI_KnowledgeBase,
                                    varSelectedQnA,
                                    {
                                        Issue_Title: txt_DrawerQuestion.Text,
                                        System: If(IsBlank(dd_DrawerSystem.Selected.Value), varSelectedQnA.System, dd_DrawerSystem.Selected.Value),
                                        Approved_Answer: txt_DrawerAnswer.Text,
                                        Required_Information: txt_DrawerReqInfo.Text
                                    }
                                );
                                Set(varDrawerOpen, false);
                                Notify("บันทึกการแก้ไข Q&A เรียบร้อยแล้ว", NotificationType.Success)
                            )
                        )
                    )
                Size: =10
                Text: ="บันทึกข้อมูล"
                Width: =120

    conConfirmModal As groupContainer.autoLayoutContainer:
        Fill: =RGBA(15, 23, 42, 0.6)
        Height: =Parent.Height
