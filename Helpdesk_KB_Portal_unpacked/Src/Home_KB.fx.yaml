                btn_ConfirmOk As label:
                    Align: =Align.Center
                    Color: =RGBA(255, 255, 255, 1)
                    Fill: =RGBA(220, 53, 69, 1)
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Semibold
                    Height: =32
                    OnSelect: |-
                        =Remove(AI_KnowledgeBase, varSelectedQnA);
