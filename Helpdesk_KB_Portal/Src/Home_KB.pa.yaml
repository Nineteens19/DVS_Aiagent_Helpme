Screens:
  Home_KB:
    Properties:
      Fill: =RGBA(248, 249, 250, 1)
      LoadingSpinnerColor: =RGBA(1, 33, 105, 1)
    Children:
      - conAppFrame:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(248, 249, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(1, 33, 105, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lbl_BrandName:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 205, 0, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        Size: =12
                        Text: ="DEVES INSURANCE"
                        Width: =150
                  - lbl_HeaderTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        Size: =13
                        Text: ="Helpdesk AI Knowledge Base Management Portal"
                        Width: =420
                  - lbl_RoleBadge:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(varIsKBAdmin, RGBA(4, 120, 87, 1), RGBA(71, 85, 105, 1))
                        Fill: =If(varIsKBAdmin, RGBA(209, 250, 229, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =10
                        Text: =varUserRole
                        Width: =160
                  - lbl_HeaderSync:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Size: =10
                        Text: |-
                          ="อัปเดตล่าสุด: " & Text(varLastRefreshedTime, "hh:mm:ss")
                        Width: =140
                  - btn_GlobalRefresh:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(1, 33, 105, 1)
                        Fill: =RGBA(255, 205, 0, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        OnSelect: |-
                          =Refresh(AI_KnowledgeBase);
                          Refresh(SystemManuals);
                          Refresh(Systems);
                          Refresh(KnowledgeGaps);
                          Set(varLastRefreshedTime, Now());
                          Notify("รีเฟรชข้อมูล SharePoint ทั้งหมดเรียบร้อยแล้ว", NotificationType.Success)
                        Size: =10
                        Text: ="รีเฟรชข้อมูล"
                        Width: =90
                  - lbl_UserProfile:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 0.95)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Size: =11
                        Text: =varCurrentUser.FullName
                        Width: =280
            - conKPIBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 249, 250, 1)
                  FillPortions: =0
                  Height: =74
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingBottom: =6
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =6
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lbl_KPI_Manuals:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(1, 33, 105, 1)
                        BorderThickness: =2
                        Color: =RGBA(1, 33, 105, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =58
                        OnSelect: =Set(varActiveTab, "MANUALS")
                        Size: =11
                        Text: |-
                          ="คู่มือระบบที่อนุมัติ: " & Text(CountRows(Filter(SystemManuals, IsActive = true || IsBlank(IsActive)))) & " รายการ"
                        Width: =310
                  - lbl_KPI_QnA:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(4, 120, 87, 1)
                        BorderThickness: =2
                        Color: =RGBA(4, 120, 87, 1)
                        Fill: =RGBA(209, 250, 229, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =58
                        OnSelect: =Set(varActiveTab, "QNA"); Set(varFilterStatus, "Active")
                        Size: =11
                        Text: |-
                          ="Q&A เปิดใช้งาน: " & Text(CountRows(Filter(AI_KnowledgeBase, Is_Active = "Active" || Is_Active = "Yes" || IsBlank(Is_Active)))) & " รายการ"
                        Width: =310
                  - lbl_KPI_Gaps:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(180, 83, 9, 1)
                        BorderThickness: =2
                        Color: =RGBA(180, 83, 9, 1)
                        Fill: =RGBA(254, 243, 199, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =58
                        OnSelect: =Set(varActiveTab, "GAPS")
                        Size: =11
                        Text: |-
                          ="คำถามรอตอบ (Gaps): " & Text(CountRows(Filter(KnowledgeGaps, GapStatus = "New" || Status = "New"))) & " ข้อ"
                        Width: =310
                  - lbl_KPI_Systems:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(10, 53, 144, 1)
                        BorderThickness: =2
                        Color: =RGBA(10, 53, 144, 1)
                        Fill: =RGBA(239, 246, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =58
                        Size: =11
                        Text: |-
                          ="ระบบงานในสารบบ: " & Text(CountRows(colMasterSystems)) & " ระบบ"
                        Width: =310
            - conModuleTabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =46
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingBottom: =4
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - btn_TabQnA:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =If(varActiveTab = "QNA", RGBA(1, 33, 105, 1), RGBA(226, 232, 240, 1))
                        BorderThickness: =1
                        Color: =If(varActiveTab = "QNA", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                        Fill: =If(varActiveTab = "QNA", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varActiveTab, "QNA"); Set(varDrawerOpen, false)
                        Size: =11
                        Text: ="1. คำถาม-คำตอบ (Q&A Knowledge Base)"
                        Width: =270
                  - btn_TabManuals:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =If(varActiveTab = "MANUALS", RGBA(1, 33, 105, 1), RGBA(226, 232, 240, 1))
                        BorderThickness: =1
                        Color: =If(varActiveTab = "MANUALS", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                        Fill: =If(varActiveTab = "MANUALS", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varActiveTab, "MANUALS"); Set(varDrawerOpen, false)
                        Size: =11
                        Text: ="2. คู่มือระบบ (System Manuals Library)"
                        Width: =270
                  - btn_TabGaps:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =If(varActiveTab = "GAPS", RGBA(1, 33, 105, 1), RGBA(226, 232, 240, 1))
                        BorderThickness: =1
                        Color: =If(varActiveTab = "GAPS", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                        Fill: =If(varActiveTab = "GAPS", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varActiveTab, "GAPS"); Set(varDrawerOpen, false)
                        Size: =11
                        Text: ="3. คำถามที่รอตอบ (Knowledge Gaps)"
                        Width: =270
                  - btn_UploadManualTrigger:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(40, 167, 69, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: =Set(varUploadModalOpen, true)
                        Size: =11
                        Text: ="+ อัปโหลดคู่มือระบบใหม่"
                        Visible: =varIsKBAdmin && varActiveTab = "MANUALS"
                        Width: =180
            - conMainWorkspace:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 249, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height - 210
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - conQnAView:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(248, 249, 250, 1)
                        FillPortions: =1
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Visible: =varActiveTab = "QNA"
                        Width: =If(varDrawerOpen, Parent.Width - 440, Parent.Width)
                      Children:
                        - conQnAToolbar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingBottom: =4
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =4
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =Parent.Width
                            Children:
                              - txt_QnASearch:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(226, 232, 240, 1)
                                    Color: =RGBA(15, 23, 42, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    HintText: ="ค้นหาคำถาม, หัวข้อปัญหา, หรือ KB ID..."
                                    Size: =10
                                    Width: =320
                              - dd_QnASystemFilter:
                                  Control: Classic/ComboBox@2.4.0
                                  Properties:
                                    BorderColor: =RGBA(226, 232, 240, 1)
                                    Height: =32
                                    Items: =colMasterSystems.Title
                                    SelectMultiple: =false
                                    Width: =200
                              - btn_QnASearchClear:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(226, 232, 240, 1)
                                    BorderThickness: =1
                                    Color: =RGBA(71, 85, 105, 1)
                                    Fill: =RGBA(241, 245, 249, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =30
                                    OnSelect: =Reset(txt_QnASearch); Reset(dd_QnASystemFilter); Set(varFilterStatus, "All")
                                    Size: =10
                                    Text: ="ล้างตัวกรอง"
                                    Width: =80
                              - btn_QnAFilterAll:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =If(varFilterStatus = "All", RGBA(1, 33, 105, 1), RGBA(226, 232, 240, 1))
                                    BorderThickness: =1
                                    Color: =If(varFilterStatus = "All", RGBA(255, 255, 255, 1), RGBA(1, 33, 105, 1))
                                    Fill: =If(varFilterStatus = "All", RGBA(1, 33, 105, 1), RGBA(241, 245, 249, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    OnSelect: =Set(varFilterStatus, "All")
                                    Size: =10
                                    Text: ="ทั้งหมด"
                                    Width: =70
                              - btn_QnAFilterActive:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =If(varFilterStatus = "Active", RGBA(4, 120, 87, 1), RGBA(226, 232, 240, 1))
                                    BorderThickness: =1
                                    Color: =If(varFilterStatus = "Active", RGBA(255, 255, 255, 1), RGBA(4, 120, 87, 1))
                                    Fill: =If(varFilterStatus = "Active", RGBA(4, 120, 87, 1), RGBA(209, 250, 229, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    OnSelect: =Set(varFilterStatus, "Active")
                                    Size: =10
                                    Text: ="Active (เปิด)"
                                    Width: =85
                              - btn_QnAFilterInactive:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =If(varFilterStatus = "Inactive", RGBA(71, 85, 105, 1), RGBA(226, 232, 240, 1))
                                    BorderThickness: =1
                                    Color: =If(varFilterStatus = "Inactive", RGBA(255, 255, 255, 1), RGBA(71, 85, 105, 1))
                                    Fill: =If(varFilterStatus = "Inactive", RGBA(71, 85, 105, 1), RGBA(241, 245, 249, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    OnSelect: =Set(varFilterStatus, "Inactive")
                                    Size: =10
                                    Text: ="Inactive (ปิด)"
                                    Width: =85
                              - btn_NewQnAAction:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(1, 33, 105, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    OnSelect: =Set(varDrawerMode, "NEW"); Set(varSelectedQnA, Blank()); Set(varDrawerOpen, true)
                                    Size: =10
                                    Text: ="+ เพิ่มข้อคำถาม Q&A"
                                    Visible: =varIsKBAdmin
                                    Width: =150
                        - conQnAGridHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(1, 33, 105, 1)
                              FillPortions: =0
                              Height: =38
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =Parent.Width
                            Children:
                              - lbl_HdrQID:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="KB ID"
                                    Width: =100
                              - lbl_HdrQSys:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="ระบบงาน"
                                    Width: =130
                              - lbl_HdrQTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="หัวข้อคำถาม (Question)"
                                    Width: =290
                              - lbl_HdrQAns:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="คำตอบที่อนุมัติ (Approved Answer)"
                                    Width: =320
                              - lbl_HdrQCat:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="หมวดหมู่"
                                    Width: =110
                              - lbl_HdrQStat:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="สถานะ"
                                    Width: =80
                              - lbl_HdrQToggle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="สลับสถานะ"
                                    Width: =70
                              - lbl_HdrQAct:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =10
                                    Text: ="การจัดการ"
                                    Width: =90
                        - galQnAGrid:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(226, 232, 240, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Items: |-
                                =SortByColumns(
                                    Filter(
                                        AI_KnowledgeBase,
                                        (IsBlank(txt_QnASearch.Text) Or StartsWith(Issue_Title, txt_QnASearch.Text) Or StartsWith(Title, txt_QnASearch.Text)) And
                                        (IsBlank(dd_QnASystemFilter.Selected.Value) Or System = dd_QnASystemFilter.Selected.Value) And
                                        (varFilterStatus = "All" Or (varFilterStatus = "Active" And (Is_Active = "Active" Or Is_Active = "Yes" Or IsBlank(Is_Active))) Or (varFilterStatus = "Inactive" And (Is_Active = "Inactive" Or Is_Active = "No")))
                                    ),
                                    "Created",
                                    SortOrder.Descending
                                )
                              TemplateSize: =44
                              Width: =Parent.Width
                            Children:
                              - lbl_RowQID:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(100, 116, 139, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    PaddingLeft: =8
                                    Size: =10
                                    Text: =ThisItem.Title
                                    Width: =95
                                    X: =10
                                    Y: =6
                              - lbl_RowQSys:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(71, 85, 105, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    PaddingLeft: =4
                                    Size: =10
                                    Text: =ThisItem.System
                                    Width: =120
                                    X: =110
                                    Y: =6
                              - lbl_RowQTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(1, 33, 105, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    OnSelect: =Set(varSelectedQnA, ThisItem); Set(varDrawerMode, "EDIT"); Set(varDrawerOpen, true)
                                    PaddingLeft: =4
                                    Size: =10
                                    Text: =ThisItem.Issue_Title
                                    Tooltip: ="คลิกเพื่อแก้ไขคำถาม"
                                    Width: =280
                                    X: =240
                                    Y: =6
                              - lbl_RowQAns:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(15, 23, 42, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    PaddingLeft: =4
                                    Size: =10
                                    Text: |-
                                      ="คำตอบ: " & Left(ThisItem.Approved_Answer, 65) & If(Len(ThisItem.Approved_Answer) > 65, "...", "")
                                    Width: =310
                                    X: =530
                                    Y: =6
                              - lbl_RowQCat:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(100, 116, 139, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    PaddingLeft: =4
                                    Size: =10
                                    Text: =If(IsBlank(ThisItem.Category.Value), "General", ThisItem.Category.Value)
                                    Width: =100
                                    X: =850
                                    Y: =6
                              - lbl_RowQStat:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =If(ThisItem.Is_Active = "Active" || ThisItem.Is_Active = "Yes" || IsBlank(ThisItem.Is_Active), RGBA(4, 120, 87, 1), RGBA(71, 85, 105, 1))
