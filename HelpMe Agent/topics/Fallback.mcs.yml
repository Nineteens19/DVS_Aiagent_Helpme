mcs.metadata:
  componentName: ทางเลือก
  description: หัวข้อของระบบนี้จะทริกเกอร์เมื่อคำพูดของผู้ใช้ไม่ตรงกับหัวข้อในปัจจุบัน
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  actions:
    - kind: ConditionGroup
      id: fallback_special_check
      conditions:
        - id: fallback_is_case_tracking
          condition: =Or("hd-" in Lower(System.Activity.Text), "ติดตาม" in System.Activity.Text, "สถานะเคส" in System.Activity.Text, "เช็คเคส" in System.Activity.Text, "ตามเคส" in System.Activity.Text, "เคสของฉัน" in System.Activity.Text)
          actions:
            - kind: BeginDialog
              id: fallback_to_case_status
              dialog: cr616_helpMeAgentUat.topic.CaseStatus

            - kind: EndDialog
              id: end_fallback_case
              clearTopicQueue: true

        - id: fallback_is_reopen
          condition: =Or("reopen" in Lower(System.Activity.Text), "เปิดเคสเดิม" in System.Activity.Text, "เปิดเรื่องเดิม" in System.Activity.Text)
          actions:
            - kind: BeginDialog
              id: fallback_to_reopen
              dialog: cr616_helpMeAgentUat.topic.ReopenCase

            - kind: EndDialog
              id: end_fallback_reopen
              clearTopicQueue: true

        - id: conditionItem_tlGIVo
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_QZreqo
              activity: ขออภัยครับ ผมยังไม่ค่อยเข้าใจคำถามนี้ 🙏 ท่านลองพิมพ์ใหม่อีกครั้ง หรือพิมพ์ "แจ้งปัญหา" เพื่อให้ผมช่วยเปิดเคสส่งต่อเจ้าหน้าที่ได้เลยนะครับ
      elseActions:
        - kind: SendActivity
          id: sendMessage_fallbackEscalate
          activity: ขออภัยครับ ผมยังไม่พบข้อมูลที่ยืนยันได้ ผมจะเปิดเคสส่งต่อให้เจ้าหน้าที่ Helpdesk ดูแลต่อให้นะครับ
        - kind: BeginDialog
          id: beginDialog_fallbackEscalate
          dialog: cr616_helpMeAgentUat.topic.OpenCase