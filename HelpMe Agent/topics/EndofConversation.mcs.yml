mcs.metadata:
  componentName: จบการสนทนา
  description: |-
    หัวข้อของระบบนี้จะทริกเกอร์จากการดำเนินการที่เปลี่ยนเส้นทางเท่านั้น
    และจะแนะนำผู้ใช้ผ่านการให้คะแนนการสนทนากับเอเจนต์
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnSystemRedirect
  id: main
  actions:
    - kind: Question
      id: 41d42054-d4cb-4e90-b922-2b16b37fe379
      conversationOutcome: ResolvedImplied
      alwaysPrompt: true
      variable: init:Topic.SurveyResponse
      prompt: สิ่งนี้ตอบคำถามของคุณหรือไม่
      entity: BooleanPrebuiltEntity

    - kind: ConditionGroup
      id: condition-0
      conditions:
        - id: condition-0-item-0
          condition: =Topic.SurveyResponse = true
          actions:
            - kind: CSATQuestion
              id: csat_1
              conversationOutcome: ResolvedConfirmed

            - kind: SendActivity
              id: sendMessage_8r29O0
              activity: ขอบคุณสำหรับข้อคิดเห็นของคุณ

            - kind: Question
              id: question_1
              alwaysPrompt: true
              variable: init:Topic.Continue
              prompt: ฉันช่วยอะไรได้อีกไหม
              entity: BooleanPrebuiltEntity

            - kind: ConditionGroup
              id: condition-1
              conditions:
                - id: condition-1-item-0
                  condition: =Topic.Continue = true
                  actions:
                    - kind: SendActivity
                      id: sendMessage_4eOE6h
                      activity: พูดมาเลย ฉันฟังอยู่

              elseActions:
                - kind: SendActivity
                  id: yHBz55
                  activity: โอเค ลาก่อน

                - kind: EndConversation
                  id: jh1GMT

      elseActions:
        - kind: Question
          id: PM68ot
          alwaysPrompt: true
          variable: init:Topic.TryAgain
          prompt: ขออภัย ฉันไม่สามารถช่วยคุณมากกว่านี้ได้ ต้องการลองอีกครั้งหรือไม่
          entity: BooleanPrebuiltEntity

        - kind: ConditionGroup
          id: KNxYBf
          conditions:
            - id: DPveFP
              condition: =Topic.TryAgain = false

          elseActions:
            - kind: SendActivity
              id: GrVHEW
              activity: พูดมาเลย ฉันฟังอยู่