mcs.metadata:
  componentName: เปิดเคส Helpdesk
  description: เก็บรายละเอียดปัญหาที่ตอบไม่ได้ แล้วเปิดเคสส่งต่อเจ้าหน้าที่ Helpdesk (บันทึกลง SharePoint และส่งอีเมล)
kind: AdaptiveDialog
modelDescription: |-
  ใช้เมื่อไม่พบคำตอบที่ยืนยันได้จากฐานความรู้ หรือเมื่อผู้ใช้ต้องการให้เปิดเคส/ส่งเรื่องต่อให้เจ้าหน้าที่ (มนุษย์)
  หัวข้อนี้จะเก็บรายละเอียดปัญหาให้ครบแล้วบันทึกเปิดเคสให้เจ้าหน้าที่ดูแลต่อ
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - เปิดเคส
      - ขอเปิดเคส
      - ส่งเรื่องต่อ
      - คุยกับเจ้าหน้าที่
      - ติดต่อเจ้าหน้าที่
      - ขอความช่วยเหลือจากเจ้าหน้าที่

  actions:
    - kind: Question
      id: question_oc_type
      interruptionPolicy:
        allowInterruption: true

      variable: Topic.issue_type
      prompt: ปัญหาที่พบเป็นประเภทไหนครับ เลือกได้เลยครับ
      entity:
        kind: EmbeddedEntity
        sensitivityLevel: None
        definition:
          kind: ClosedListEntity
          items:
            - id: สิทธิ์การใช้งาน
              displayName: สิทธิ์การใช้งาน

            - id: IT / ระบบ
              displayName: IT / ระบบ

            - id: อื่น ๆ
              displayName: อื่น ๆ

            - id: โปรแกรม / Application
              displayName: โปรแกรม / Application

    - kind: Question
      id: question_oc_priority
      interruptionPolicy:
        allowInterruption: true

      variable: Topic.priority
      prompt: ปัญหานี้เร่งด่วนแค่ไหนครับ
      entity:
        kind: EmbeddedEntity
        sensitivityLevel: None
        definition:
          kind: ClosedListEntity
          items:
            - id: ปกติ
              displayName: ปกติ

            - id: ด่วน
              displayName: ด่วน

    - kind: Question
      id: question_oc_system
      interruptionPolicy:
        allowInterruption: true

      repeatCount: 0
      variable: Topic.System
      prompt: ปัญหาที่พบอยู่ในระบบไหนครับ
      entity:
        kind: EmbeddedEntity
        sensitivityLevel: None
        definition:
          kind: ClosedListEntity
          items:
            - id: DSS
              displayName: DSS

            - id: Renewal Motor
              displayName: Renewal Motor

            - id: Polisy 400
              displayName: Polisy 400

            - id: PCS
              displayName: PCS

            - id: อื่นๆ (ระบุเอง)
              displayName: อื่นๆ (ระบุเอง)

        displayName: EmbeddedEntity-openCaseSystem

    - kind: SetVariable
      id: setVariable_oc_systemName
      variable: Topic.SystemName
      value: =Text(Topic.System)

    - kind: ConditionGroup
      id: conditionGroup_oc_systemOther
      conditions:
        - id: conditionItem_oc_systemOther
          condition: =Text(Topic.System) = "อื่นๆ (ระบุเอง)"
          actions:
            - kind: InvokeFlowAction
              id: invokeFlowAction_oc_getsys
              input:
                binding: {}
              output:
                binding:
                  systemsText: Topic.SystemsText
              flowId: 7c1e2f30-1111-4aaa-bbbb-000000000042

            - kind: SendActivity
              id: sendActivity_oc_syshint
              activity: "ระบบที่รองรับตอนนี้: {Topic.SystemsText} — พิมพ์ชื่อระบบที่พบปัญหาได้เลยครับ (ถ้าไม่มีในรายการ พิมพ์ชื่อระบบของท่านได้เลย)"

            - kind: Question
              id: question_oc_systemOther
              interruptionPolicy:
                allowInterruption: true

              variable: Topic.SystemName
              prompt: พิมพ์ชื่อระบบที่พบปัญหาครับ
              entity: StringPrebuiltEntity

    - kind: Question
      id: question_oc_detail
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.IssueDetail
      prompt: ช่วยเล่ารายละเอียดปัญหาให้ผมหน่อยครับ (อาการที่พบ ข้อความ Error เลขอ้างอิง หรือข้อมูลที่เกี่ยวข้อง)
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_oc_name
      interruptionPolicy:
        allowInterruption: true

      variable: Topic.ContactName
      prompt: ขอชื่อของท่านหน่อยครับ
      entity: PersonNamePrebuiltEntity

    - kind: Question
      id: question_oc_tel
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.ContactTel
      prompt: ขอเบอร์ติดต่อกลับของท่านหน่อยครับ
      entity: StringPrebuiltEntity

    - kind: SendActivity
      id: sendActivity_oc_ack
      activity: ขอบคุณครับ 🙏 ผมกำลังเปิดเคสและส่งเรื่องต่อให้เจ้าหน้าที่ Helpdesk ดูแลให้นะครับ เดี๋ยวมีเจ้าหน้าที่ติดต่อกลับแน่นอนครับ

    - kind: InvokeFlowAction
      id: invokeFlowAction_oc
      input:
        binding:
          text: ="🔧 แจ้งปัญหาระบบ ( ใช้งานไม่ได้ ) "
          text_1: =System.User.Email
          text_2: =Text(Topic.ContactName)
          text_3: =Text(Topic.ContactTel)
          text_4: =Topic.SystemName
          text_5: ="[" & Text(Topic.issue_type) & " / " & Text(Topic.priority) & "] " & Topic.IssueDetail
          text_6: "-"

      output: {}
      flowId: 15bbc09f-f01a-d621-d0ac-71a27363b2b5

inputType: {}
outputType: {}
