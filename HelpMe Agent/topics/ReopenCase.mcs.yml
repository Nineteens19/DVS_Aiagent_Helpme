mcs.metadata:
  componentName: เปิดเรื่องเคสเดิมใหม่
  description: ให้ผู้แจ้งเปิดเรื่องเคสเดิมที่ยังไม่ได้รับการแก้ไขขึ้นมาใหม่ และแจ้งเจ้าหน้าที่
kind: AdaptiveDialog
modelDescription: |-
  ใช้เมื่อผู้ใช้บอกว่าเคสเดิมยังไม่หาย ยังแก้ไม่ได้ หรือขอเปิดเรื่องเคสเดิมขึ้นมาดูแลต่ออีกครั้ง (reopen)
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - เปิดเคสเดิมใหม่
      - ขอเปิดเคสเดิมใหม่
      - ขอเปิดเคสเดิม
      - เปิดเคสเดิม
      - เคสเดิมยังไม่หาย
      - ปัญหายังไม่หาย
      - ยังแก้ไม่ได้
      - ขอเปิดเรื่องเคสเดิม
      - เคสที่แจ้งยังไม่หาย
      - ขอ reopen
      - reopen case
      - reopen
      - เปิดเรื่องใหม่

  actions:
    - kind: Question
      id: question_rc_caseid
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.CaseId
      prompt: กรุณาพิมพ์หมายเลขเคสที่ต้องการเปิดเรื่องใหม่ครับ (เช่น HD-20260916-1)
      entity: StringPrebuiltEntity

    - kind: InvokeFlowAction
      id: invokeFlowAction_rc
      input:
        binding:
          reporterEmail: =Coalesce(System.User.Email, "")
          caseId: =Trim(Text(Topic.CaseId))

      output:
        binding:
          resultText: Topic.Result

      flowId: 7c1e2f30-1111-4aaa-bbbb-000000000043

    - kind: SendActivity
      id: sendActivity_rc_result
      activity: "{Topic.Result}"

    - kind: Question
      id: question_rc_next
      variable: Topic.NextStep
      prompt: มีรายการอื่นให้ผมช่วยเหลือเพิ่มเติมไหมครับ 😊
      entity:
        kind: EmbeddedEntity
        definition:
          kind: ClosedListEntity
          items:
            - id: "📋 ติดตามสถานะเคส"
              displayName: "📋 ติดตามสถานะเคส"

            - id: "🏠 กลับสู่เมนูหลัก"
              displayName: "🏠 กลับสู่เมนูหลัก"

            - id: "ไม่ต้องการแล้ว ขอบคุณครับ"
              displayName: "ไม่ต้องการแล้ว ขอบคุณครับ"

    - kind: ConditionGroup
      id: condition_rc_next_step
      conditions:
        - id: cond_rc_track
          condition: =Text(Topic.NextStep) = "📋 ติดตามสถานะเคส"
          actions:
            - kind: BeginDialog
              id: begin_rc_case_status
              dialog: cr616_helpMeAgentUat.topic.CaseStatus

        - id: cond_rc_menu
          condition: =Text(Topic.NextStep) = "🏠 กลับสู่เมนูหลัก"
          actions:
            - kind: BeginDialog
              id: begin_rc_menu
              dialog: cr616_helpMeAgentUat.topic.v4K

      elseActions:
        - kind: SendActivity
          id: send_rc_bye
          activity: ยินดีที่ได้ให้บริการครับ หากมีปัญหาหรือต้องการติดตามเคสเมื่อใด สามารถพิมพ์บอกผมได้ตลอดเวลานะครับ 😊

inputType: {}
outputType: {}
