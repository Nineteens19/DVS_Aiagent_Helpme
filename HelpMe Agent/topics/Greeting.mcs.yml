mcs.metadata:
  componentName: การทักทาย
  description: หัวข้อนี้จะทริกเกอร์เมื่อผู้ใช้ทักทายเอเจนต์
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: การทักทาย
    includeInOnSelectIntent: false
    triggerQueries:
      - สวัสดีตอนบ่าย
      - สวัสดีตอนเช้า
      - สวัสดี
      - เฮ้

  actions:
    - kind: SendActivity
      id: sendMessage_abmysR
      activity:
        text:
          - "สวัสดีครับ ผมคือ HelpMe ผู้ช่วยด้านระบบงานภายในครับ 😊\n\nผมสามารถช่วยท่าน:\n• 🔧 แจ้งปัญหาระบบ / เปิดเคสใหม่\n• 📋 ติดตามสถานะเคส / เคสของฉัน\n• 🔄 ขอเปิดเคสเดิมใหม่ (Reopen)\n• 👤 ขอปลดล็อค User / รีเซ็ตรหัสผ่าน\n• 💬 สอบถามวิธีใช้งานระบบ"
        speak:
          - สวัสดีครับ ผมคือ HelpMe มีอะไรให้ผมช่วยได้บ้างครับ

    - kind: BeginDialog
      id: beginDialog_greetingMenu
      dialog: cr616_helpMeAgentUat.topic.v4K